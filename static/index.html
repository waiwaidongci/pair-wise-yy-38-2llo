<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水库防汛调度与操作确认</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.45rem .9rem;margin:.15rem}input{padding:.4rem;margin:.15rem;width:7rem}h2{margin-top:1.5rem}.muted{color:#6b7a8a}</style></head><body><h1>水库防汛调度与操作确认</h1><p>观测、指令、操作记录与审计共用依据版本；观测更新后未执行指令退回待复核。</p><div class="muted">使用X-Actor和X-Role请求头传递身份。</div><h2>水情观测</h2><div>库位<input id="level" type="number" step="0.1" placeholder="118.5">入库流量<input id="inflow" type="number" step="1" placeholder="3200"><button onclick="recordObs()">记录观测</button><button onclick="loadObs()">刷新</button></div><pre id="obs">未加载</pre><h2>调度指令</h2><div><button onclick="loadItems()">刷新列表</button></div><pre id="out">未加载</pre><script>const H={'Content-Type':'application/json'};function auth(actor,role){return{'X-Actor':actor,'X-Role':role,...H}}
async function loadObs(){const r=await fetch('/api/observations',{headers:{'X-Actor':'demo','X-Role':'viewer'}});const d=await r.json();document.getElementById('obs').textContent=JSON.stringify(d,null,2)}
async function recordObs(){const level=parseFloat(document.getElementById('level').value);const inflow=parseFloat(document.getElementById('inflow').value);const r=await fetch('/api/observations',{method:'POST',headers:auth('observer','duty_officer'),body:JSON.stringify({reservoir_level:level,inflow:inflow})});document.getElementById('obs').textContent=JSON.stringify(await r.json(),null,2);loadItems()}
async function loadItems(){const r=await fetch('/api/items',{headers:{'X-Actor':'demo','X-Role':'viewer'}});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}
loadObs();loadItems();</script></body></html>
